<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YVR Water Fountains Map - Find & Rate Drinking Fountains in Vancouver & Burnaby</title>
  <meta name="description" content="Interactive map of 429+ water fountains across Vancouver and Burnaby. Find nearby drinking fountains, read community ratings, and discover pet-friendly options.">
  <meta name="keywords" content="water fountains, Vancouver, Burnaby, drinking water, public fountains, hydration stations">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/logo.png">
  
  <!-- Social media meta tags -->
  <meta property="og:title" content="YVR Water Fountains Map">
  <meta property="og:description" content="Find and rate drinking fountains across Vancouver and Burnaby">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yvr-water-fountains.netlify.app/map.html">
  
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="YVR Water Fountains Map">
  <meta name="twitter:description" content="Find and rate drinking fountains across Vancouver and Burnaby">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/theme.css?v=3">
  <style>
body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--color-dark);
}

/* ── Header ── */
.header {
  background: var(--color-primary);
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.header-logo {
  width: 100px;
  height: auto;
  border-radius: 16px;
}

.header h1 {
  margin: 0;
  line-height: 0;
}

.header-title-img {
  height: 130px;
  max-width: 100%;
  width: auto;
  display: block;
  object-fit: contain;
}

.header .tagline {
  font-family: var(--font-subtitle);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--color-dark);
  opacity: 0.7;
  letter-spacing: 0.03em;
}

.nav-links {
  display: flex;
  gap: 1.2rem;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
  width: 100%;
}

.nav-link {
  color: var(--color-secondary);
  font-family: 'Courier New', monospace;
  font-size: 1.05rem;
  font-weight: 700;
  text-decoration: none;
  text-transform: lowercase;
  letter-spacing: 0.05em;
  border-bottom: 2px dotted var(--color-secondary);
  padding-bottom: 1px;
  transition: all 0.2s;
}

.nav-link:hover {
  color: var(--color-dark);
  border-bottom-style: solid;
}

/* ── Map ── */
#map {
  height: calc(100vh - 120px);
}

/* ── Tile filter (preview — remove after choosing) ── */
.leaflet-tile-pane {
  filter: saturate(0.6) brightness(1.08);
}


/* ── Leaflet popup override ── */
.leaflet-popup-content-wrapper {
  border-radius: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  padding: 0;
}

.leaflet-popup-content {
  margin: 0;
  font-family: var(--font-body);
}

/* ── Bottom sheet ── */
.bottom-sheet {
  overscroll-behavior: contain;   /* scrolling stops at the sheet's ends, never moves the page */
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-radius: 20px 20px 0 0;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
  transform: translateY(100%);
  transition: transform 0.3s ease-out;
  z-index: 2000;
  max-height: 80vh;
  overflow-y: auto;
  overflow-x: hidden;
}

.bottom-sheet.active {
  transform: translateY(0);
}

.sheet-color-bar {
  height: 4px;
  background: var(--color-tertiary);
}

.sheet-color-bar.kind-ours,
.sheet-color-bar.kind-both {
  background: var(--color-primary);
}

.sheet-color-bar.kind-public {
  background: var(--color-secondary);
}

.sheet-color-bar.kind-issue {
  background: #d9d9e3;
}

.bottom-sheet-handle {
  width: 40px;
  height: 4px;
  background: #ddd;
  border-radius: 2px;
  margin: 12px auto;
}

.bottom-sheet-content {
  padding: 0 20px 20px;
}

.bottom-sheet-close {
  position: absolute;
  top: 10px;
  right: 16px;
  background: none;
  border: none;
  font-size: 1.5rem;
  color: #999;
  cursor: pointer;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Fountain info (same content in the sheet and the popup) ── */
.fountain-info {
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 0.85rem;
}

.leaflet-popup-content .fountain-info {
  padding: 16px;
  border-top: 4px solid var(--color-tertiary);
}

.leaflet-popup-content .fountain-info.kind-ours,
.leaflet-popup-content .fountain-info.kind-both {
  border-top-color: var(--color-primary);
}

.leaflet-popup-content .fountain-info.kind-public {
  border-top-color: var(--color-secondary);
}

.leaflet-popup-content .fountain-info.kind-issue {
  border-top-color: #d9d9e3;
}

.info-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  padding-right: 28px;
}

.info-titles {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

.info-title {
  font-family: var(--font-heading);
  font-size: 1.15rem;
}

.info-subtitle {
  font-size: 0.8rem;
  color: #3d3d55;
}

.info-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: none;
  white-space: nowrap;
  font-size: 0.75rem;
  font-weight: 700;
  background: var(--color-light);
  border-radius: 999px;
  padding: 4px 10px;
}

.info-rating-row {
  display: flex;
  gap: 10px;
  align-items: stretch;
}

.info-latest {
  background: var(--color-primary);
  border-radius: 14px;
  padding: 8px 14px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.info-latest-number {
  font-family: var(--font-heading);
  font-size: 2.1rem;
  line-height: 1;
}

.info-out-of {
  font-size: 0.9rem;
}

.info-latest-date {
  font-size: 0.7rem;
  font-weight: 700;
}

.info-rating-side {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
  font-weight: 600;
}

.info-post {
  display: flex;
  align-items: center;
  gap: 8px;
}

.info-photo {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  object-fit: cover;
  flex: none;
}

.fountain-info .info-post-link {
  color: var(--color-dark);
  font-weight: 700;
  text-decoration: underline;
  text-decoration-color: var(--color-blue);
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
}

.info-unrated {
  font-weight: 600;
  color: #3d3d55;
}

.info-issue {
  background: #ececf3;
  border-radius: 10px;
  padding: 8px 12px;
  font-weight: 600;
}

.info-details {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 10px;
  font-size: 0.78rem;
  background: var(--color-blue-light);
  border-radius: 12px;
  padding: 10px 12px;
}

.info-detail.wide {
  grid-column: 1 / -1;
}

.info-detail-label {
  color: #3d3d55;
}

/* Actions: Review this fountain, then two equal problem buttons */
.info-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.info-problems {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.info-problem {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.info-problem-meaning {
  font-size: 0.72rem;
  line-height: 1.3;
  color: #3d3d55;
  text-align: center;
}

.fountain-info .info-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 48px;
  box-sizing: border-box;
  padding: 4px 8px;
  border-radius: 14px;
  font-family: var(--font-heading);
  font-size: 1rem;
  color: var(--color-dark);
  text-decoration: none;
}

.info-btn.primary {
  background: var(--color-primary);
}

.info-btn.secondary {
  background: #fff;
  border: 3px solid var(--color-tertiary);
  font-size: 0.95rem;
}

/* Reviews: one card each, newest first */
.info-reviews {
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-top: 2px dotted var(--color-secondary);
  padding-top: 10px;
}

.info-reviews-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.info-reviews-title {
  margin: 0;
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: normal;
}

.info-reviews-count,
.info-reviews-note {
  font-size: 0.75rem;
  color: #3d3d55;
}

.info-review-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.info-review {
  background: #fff;
  border: 1.5px solid #e6d9ff;
  border-radius: 12px;
  padding: 10px 12px;
  line-height: 1.4;
}

.info-review-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}

.info-review-rating {
  flex: none;
  padding: 1px 8px;
  border-radius: 999px;
  font-weight: 700;
  color: var(--color-dark);
  background: #ffe1f0;   /* public: pink tint */
}

.info-review-rating.ours {
  background: var(--color-primary);
}

.info-review-who {
  flex: 1;
  min-width: 0;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.fountain-info .info-review-post {
  font-weight: 600;
  font-size: 0.75rem;
  color: var(--color-dark);
  text-decoration: underline;
  text-decoration-color: var(--color-blue);
  text-decoration-thickness: 2px;
  text-underline-offset: 2px;
  white-space: nowrap;
}

.info-review-date {
  flex: none;
  font-size: 0.75rem;
  color: #3d3d55;
}

.info-review-text {
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.info-review-text.clamped {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 5;
  line-clamp: 5;
  overflow: hidden;
}

.info-review-more {
  margin-top: 4px;
  padding: 6px 0;
  background: none;
  border: none;
  font: inherit;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--color-dark);
  text-decoration: underline;
  text-decoration-color: var(--color-blue);
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
  cursor: pointer;
}

/* ── Pins and legend (marks themselves are in theme.css) ── */
/* pins are a fixed size on screen (zoom bands set in map.js): every pin is
   the same size at a given zoom, and from the rating zoom they are just big
   enough for the latest rating to fit inside */
.fountain-pin {
  display: flex;
  align-items: center;
  justify-content: center;
}

.fountain-pin .mark {
  width: 11px;
  height: 11px;
  margin: 0;
  font-size: 0;
}

.pins-far .fountain-pin .mark {
  width: 8px;
  height: 8px;
  border-width: 1.5px;
}

.show-ratings .fountain-pin .mark {
  width: 14px;
  height: 14px;
  border-width: 1.5px;
  font-size: 7px;
  letter-spacing: -0.3px;
}

.pins-close .fountain-pin .mark {
  width: 16px;
  height: 16px;
  font-size: 8px;
}

.map-legend .mark {
  width: 14px;
  height: 14px;
}

.map-legend {
  background: #fff;
  border: 2px solid var(--color-dark);
  border-radius: 10px;
  box-shadow: 3px 3px 0 var(--color-dark);
  padding: 8px 10px;
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  color: var(--color-dark);
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.map-legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.map-legend-note {
  color: #3d3d55;
}

.overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1999;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease-out;
}

.overlay.active {
  opacity: 1;
  visibility: visible;
}

/* sheet open on a phone: the page behind does not scroll */
body.sheet-open {
  position: fixed;   /* top is set from map.js to keep the page where it was */
  left: 0;
  right: 0;
  width: 100%;
  overflow: hidden;
}

/* ── Footer ── */
.footer {
  background: var(--color-dark);
  color: var(--color-accent);
  padding: 1rem 1.5rem;
  text-align: center;
  font-size: 0.85rem;
}

.footer a {
  color: var(--color-primary);
  text-decoration: none;
  font-weight: 600;
}

.footer a:hover {
  color: var(--color-secondary);
}

.footer-links {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
  margin-bottom: 0.5rem;
  flex-wrap: wrap;
}

.footer-divider {
  border: none;
  border-top: 1px solid rgba(197,163,255,0.2);
  margin: 0.5rem 0;
}

.footer-credit {
  font-size: 0.75rem;
  color: rgba(197,163,255,0.6);
}

.footer .admin-link {
  color: rgba(197,163,255,0.4);
  font-weight: 400;
}

/* ── Mobile: hide popups, show bottom sheet ── */
@media (max-width: 768px) {
  .header-title-img { height: 85px; }
  .header-logo { width: 50px; }
  .nav-links { justify-content: center; margin-left: 0; }
  .nav-link { font-size: 0.85rem; }
  #map { height: calc(100vh - 100px); }
  .leaflet-popup { display: none !important; }
  .bottom-sheet {
    max-height: 85vh;
    max-height: 85dvh;   /* the visible screen, not counting Safari's toolbars */
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bottom-sheet-content { padding: 0 15px 15px; }
  .footer { padding: 0.75rem 1rem; }
  .footer-links { gap: 1rem; }
}

@media (max-width: 480px) {
  .header { padding: 0.5rem 0.75rem; }
  .header-title-img { height: 65px; }
  .nav-link { font-size: 0.75rem; }
  #map { height: calc(100vh - 90px); }
}

@media (min-width: 1200px) {
  .header { padding: 0.75rem 2rem; }
}
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <img src="images/logo.png" alt="YVR Water Fountains" class="header-logo">
      <div>
        <h1><img src="images/header.png" alt="YVR Water Fountains" class="header-title-img"></h1>

      </div>
    </div>
    <div class="nav-links">
      <a href="https://www.instagram.com/yvrwaterfountains/" target="_blank" class="nav-link">Reviews open soon</a>
      <a href="#" id="locate-me" class="nav-link">My Location</a>
      <a href="https://www.instagram.com/yvrwaterfountains/" target="_blank" class="nav-link">@yvrwaterfountains</a>
    </div>
  </div>
  

  
  <div id="map"></div>
  
  <div class="footer">
    <div class="footer-links">
      <a href="https://www.instagram.com/yvrwaterfountains/" target="_blank">@yvrwaterfountains</a>
      <a href="https://www.instagram.com/yvrwaterfountains/" target="_blank">Reviews open soon</a>
      <a href="https://github.com/kcarbeck/yvr-water-fountains" target="_blank">GitHub</a>
      <a href="review.html" class="admin-link">Admin</a>
    </div>
    <hr class="footer-divider">
    <div class="footer-credit">
      Community-maintained fountain ratings across Vancouver &amp; Burnaby
      <br>Built by <a href="https://github.com/kcarbeck" target="_blank">kcarbeck</a>
    </div>
  </div>
  
  <div class="overlay" id="overlay"></div>
  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-color-bar" id="sheet-color-bar"></div>
    <div class="bottom-sheet-handle"></div>
    <button class="bottom-sheet-close" id="bottom-sheet-close">&times;</button>
    <div class="bottom-sheet-content" id="bottom-sheet-content"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.1/dist/umd/supabase.min.js"></script>
  <script src="env.local.js" onerror="/* no local env */"></script>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/fountain-data.js?v=4"></script>
  <script src="js/map.js?v=16"></script>
</body>
</html>
