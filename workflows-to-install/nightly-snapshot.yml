# Twice a day: download the public data from Supabase, save CSV + GeoJSON
# snapshots in the repo, and (as a side effect) keep the free Supabase
# project from pausing.
#
# If Supabase is paused or broken, this job FAILS and GitHub emails you.
# Run it by hand any time: GitHub → Actions → "Nightly snapshot" → Run workflow.
#
# Uses the same two repository secrets as deploy.yml:
#   SUPABASE_URL, SUPABASE_ANON_KEY  (the public anon key — not the service key)

name: Nightly snapshot

on:
  schedule:
    - cron: "17 3,15 * * *"   # 03:17 and 15:17 UTC (≈ 8am and 8pm Vancouver)
  workflow_dispatch:

permissions:
  contents: write            # needed to commit the snapshot files

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite")'

      - name: Download data and write snapshot files
        env:
          LANG: C.UTF-8          # keeps emoji intact in the CSVs
          LC_ALL: C.UTF-8
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: Rscript scripts/snapshot_database.R

      - name: Commit the snapshot if anything changed
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot docs/data/fountains_processed.geojson
          if git diff --cached --quiet; then
            echo "No changes since last snapshot."
          else
            git commit -m "data: automatic snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
